name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find and extract project ZIP (phone-friendly upload)
        shell: bash
        run: |
          set -e
          if [ -f *.zip ]; then
            ZIP=$(ls -1 *.zip | head -n1)
            mkdir -p __project
            unzip -q "$ZIP" -d __project
            ROOT=$(find __project -name package.json -type f | head -n1 | xargs dirname)
            cp -a "$ROOT/." ./
          fi
          test -f package.json
          test -f www/index.html

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alazizi-grocery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
